name: Tests

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # libpulse0 — для QtMultimedia: MainWindow создаёт QSoundEffect, и
          # без libpulse.so.0 импорт модуля падает ещё на сборе тестов.
          sudo apt-get install -y libegl1 libdbus-1-3 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libpulse0

      - name: Install dependencies
        run: pip install -r .github/workflows/requirements-test.txt

      - name: Run tests with coverage (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ --tb=short -q --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        run: pytest tests/ --tb=short -q

      # Выгрузка покрытия — отчёт, а не результат тестов, и решать судьбу
      # сборки она не должна. Без continue-on-error шаг ронял весь job при
      # зелёных 1145 тестах: например когда CODACY_PROJECT_TOKEN не задан
      # или протух. Красный CI по такой причине читается как «тесты упали»
      # и в следующий раз его просто перестанут смотреть.
      - name: Upload coverage to Codacy
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml
